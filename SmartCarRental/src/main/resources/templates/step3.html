<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Step 3 · SmartCarRental</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="nav"><a class="brand" href="/">Smart<span>CarRental</span></a><div class="step">Step 3 of 8</div></header><main class="page"><div class="progress"><i class="active"></i><i class="active"></i><i class="active"></i><i></i><i></i><i></i><i></i><i></i></div><div class="section-head"><div><p class="eyebrow">STEP 3 · LIVE CAR SUGGESTIONS</p><h1>Cars available near <span class="accent" th:text="${location}">your location</span></h1></div><p>Showing multiple real-world vehicle categories. Availability is linked to your Step 2 location.</p></div><div class="car-grid"><article class="car-card" th:each="car : ${cars}"><img th:src="${car.image}" th:alt="${car.name}"><div class="car-body"><div class="row"><span class="tag" th:text="${car.type}">SUV</span><span class="available">● Available</span></div><h2 th:text="${car.name}">Toyota Innova Crysta</h2><p th:text="${car.location + ' · ' + car.transmission + ' · ' + car.seats + ' seats'}">Chennai · Automatic · 7 seats</p><div class="price">₹<span th:text="${car.pricePerDay}">2800</span><small>/day</small></div><form action="/step3" method="post"><input type="hidden" name="carId" th:value="${car.id}"><button class="primary wide">Select this car →</button></form></div></article></div></main></body></html>
