<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Step 2 · SmartCarRental</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="nav"><a class="brand" href="/">Smart<span>CarRental</span></a><div class="step">Step 2 of 8</div></header><main class="page"><div class="progress"><i class="active"></i><i class="active"></i><i></i><i></i><i></i><i></i><i></i><i></i></div><section class="card form-card"><p class="eyebrow">STEP 2 · TRIP DETAILS</p><h1>Tell us about your journey</h1><p class="muted">Your pickup location is saved and will be used to show relevant cars in Step 3.</p><form action="/step2" method="post" class="form-grid"><label>Full name<input name="name" required placeholder="Enter your name"></label><label>Phone number<input name="phone" required pattern="[0-9]{10}" placeholder="10-digit mobile number"></label><label>Number of members<input type="number" name="members" min="1" max="15" value="1" required></label><label>Pickup location<input id="location" name="location" required placeholder="e.g. Chennai"></label><label class="full">Destination<input name="destination" required placeholder="Where are you going?"></label><div class="notice full">Rental type: <b th:text="${rentalType}">Self Drive</b></div><button class="primary full">Save & Continue to Step 3 →</button></form></section></main></body></html>
