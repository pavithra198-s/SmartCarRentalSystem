<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookings · SmartCarRental</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="nav"><a class="brand" href="/">Smart<span>CarRental</span></a><nav><a href="/">Home</a></nav></header><main class="page"><section class="card"><p class="eyebrow">BOOKING HISTORY</p><h1>Completed rentals</h1><div class="table-wrap"><table><thead><tr><th>ID</th><th>Customer</th><th>Car</th><th>Pickup</th><th>Destination</th><th>Total</th><th>Status</th></tr></thead><tbody><tr th:each="b : ${bookings}"><td th:text="${b.id}">1</td><td th:text="${b.customerName}">Name</td><td th:text="${b.carName}">Car</td><td th:text="${b.pickupLocation}">Chennai</td><td th:text="${b.destination}">Destination</td><td>₹<span th:text="${b.totalAmount}">0</span></td><td><span class="tag" th:text="${b.status}">COMPLETED</span></td></tr><tr th:if="${#lists.isEmpty(bookings)}"><td colspan="7" class="empty">No completed bookings yet.</td></tr></tbody></table></div></section></main></body></html>
